<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Mug">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="neo-mark" content="on">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:site_name" content="Neorgon">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="robots" content="{{ROBOTS}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <meta property="og:locale" content="en_US">
  <meta name="theme-color" content="#040714">
  <meta property="og:image" content="https://mug.neorgon.com/og-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Mug: character mugs, catalogued and collected">
  <meta name="twitter:image" content="https://mug.neorgon.com/og-preview.jpg">
  <!-- The production Convex deployment (CONVEX_URL in scripts/pages.py); on
       localhost, ?convex=http://127.0.0.1:3210 points a page at a dev backend (js/backend.js). -->
  <meta name="neo-convex-url" content="{{CONVEX_URL}}">
  <meta name="clerk-publishable-key" content="pk_live_Y2xlcmsubmVvcmdvbi5jb20k">
  <meta name="neo-auth-site" content="Mug">
  <!-- Footer Kit stamps: a Source link and the last update (root smoke check 22). -->
  <meta name="neo-repo" content="energon-a-secas/mug-site">
  <meta name="neo-updated" content="updated Sep 2026">
  <!-- Fleet design tokens: canonical, do not redeclare locally (docs/references/new-project-context.md, Design) -->
  <link rel="stylesheet" href="https://cdn.neorgon.org/v1.0.0/styles/base.css">
  <link rel="stylesheet" href="/css/style.css">
{{EXTRA_CSS}}  <!-- Neorgon Header Kit (vendored; ?header=live swaps CSS to CDN). Keep after style.css, the kit owns the header. -->
  <script>(function(){var m=location.search.match(/[?&]theme=([\w-]+)/)||document.cookie.match(/(?:^|;\s*)neo_theme=([\w-]+)/);if(m&&m[1]!=='default')document.documentElement.dataset.theme=decodeURIComponent(m[1]);})();</script>
  <link rel="stylesheet" href="/css/neorgon-header.css">
  <link rel="stylesheet" href="/css/neorgon-themes.css">
  <link rel="stylesheet" href="https://cdn.neorgon.org/v1.0.0/header/season.css">
  <script defer src="/js/neorgon-header.js"></script>
  <!-- Neorgon Footer Kit (vendored). See packages/neorgon-ui/footer/README.md. -->
  <link rel="stylesheet" href="/css/neorgon-footer.css">
  <script defer src="/js/neorgon-footer.js"></script>
  <!-- Neorgon Auth Kit (vendored). Header slot, sign-in dialog and the Convex token. -->
  <link rel="stylesheet" href="/css/neorgon-auth.css">
  <!-- Neorgon Beacon Kit (vendored). Bottom-left correction reporter. -->
  <meta name="beacon-site" content="mug-site">
{{BEACON}}  <link rel="stylesheet" href="/css/neorgon-beacon.css">
  <script defer src="/js/neorgon-beacon.js"></script>
{{JSONLD}}</head>
<body data-page="{{PAGE}}">

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="header-bar" data-header-mode="app">
    <div class="header-logo">
      <a href="/" class="header-title-link">
        <img src="https://cdn.neorgon.org/v1.0.0/energon-classic-logo.png" class="header-logo-img" alt="">
        <div class="header-title-wrap">
          <h1>Mug</h1>
          <div class="header-subtitle">Character mugs, catalogued and collected</div>
        </div>
      </a>
    </div>

    <div class="header-right">
      <div class="header-actions">
        <a class="btn btn--ghost btn--sm" href="/"{{NAV_CATALOG}} data-keep-mobile>Catalog</a>
        <a class="btn btn--ghost btn--sm" href="/shelf/"{{NAV_SHELF}} data-keep-mobile>My shelf</a>
        <a class="btn btn--ghost btn--sm" href="/community/"{{NAV_COMMUNITY}}>Community</a>
        <a class="btn btn--ghost btn--sm" href="/admin/"{{NAV_ADMIN}} id="adminLink" hidden>Admin</a>
      </div>
      <div class="neo-auth" data-neo-auth data-keep-mobile hidden></div>
      <a class="header-home" href="https://neorgon.com/" title="neorgon.com" aria-label="Neorgon home">
        <svg class="nh-hub-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 4.4 18.58 8.2 18.58 15.8 12 19.6 5.42 15.8 5.42 8.2Z" fill="currentColor" stroke="none"/>
          <g class="nh-orbit">
            <path d="M2.47 17.50 A11.0 11.0 0 0 1 14.85 1.37" fill="none" stroke="currentColor" stroke-width="1.05" stroke-linecap="round"/>
            <path d="M21.53 6.50 A11.0 11.0 0 0 1 9.15 22.63" fill="none" stroke="currentColor" stroke-width="1.05" stroke-linecap="round"/>
            <circle cx="21.71" cy="6.84" r="1.25" fill="currentColor"/>
            <circle cx="2.29" cy="17.16" r="1.25" fill="currentColor"/>
          </g>
        </svg>
      </a>
    </div>
  </header>

{{MAIN}}

  <footer class="neo-footer" data-footer-mode="minimal">
    Product facts and photos belong to their makers, and every mug links back to the shop it came from. <a href="/bot/">About MugBot</a>
  </footer>

{{SCRIPTS}}</body>
</html>
