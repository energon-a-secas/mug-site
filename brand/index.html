        <p class="eyebrow">Maker</p>
        <h2 id="brandName">Loading</h2>
        <p class="muted" id="brandMeta"></p>

      <div class="mug-grid" id="grid" aria-busy="true"></div>
      <div class="load-more"><button type="button" class="btn btn--secondary" id="loadMore" hidden>Show more mugs</button></div>
